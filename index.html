<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

    content="https://effortless-chaja-2fd27c.netlify.app/.netlify/og-image/6367f12da7a9f0a09668722c51a63d4f.jpg">
  <meta property="og:image:width" content="1200">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1218">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #watermark {
      position: absolute;
      top: 16px;
      right: 16px;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 10px;
      background-color: rgba(14, 18, 24, 0.92);
      color: #e8edf5;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.1);
      z-index: 10003;
      font-size: 12px;
      line-height: 1.4;
      min-width: 200px;
    }

    #logo {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.1);
      z-index: 10003;
      pointer-events: none;
      user-select: none;
    }

    #avatar {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9eff6e, #6fc9ff);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      color: #0e1218;
      text-transform: uppercase;
      user-select: none;
    }

    /* ----- Content area ----- */
    #content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    #content .header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    #content .software {
      color: #9eff6e;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    #content .player {
      color: #e8edf5;
      font-weight: 500;
    }

    #content .timer {
      color: #ffd700;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-left: auto;
      font-size: 12px;
    }

    #content .details-line {
      font-size: 11px;
      color: #b3ffa0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #content .details-line .sep {
      color: #4a5a4e;
      margin: 0 4px;
    }

    #content .details-line .label {
      color: #8a9bb5;
    }

    #content .details-line .value {
      color: #e8edf5;
    }

    #content .details-line .no-details {
      color: #6a7a8e;
      font-style: italic;
    }

    @media (max-width: 600px) {
      #watermark {
        padding: 6px 10px;
        gap: 6px;
        top: 12px;
        right: 12px;
        min-width: 160px;
      }

      #logo {
        right: 12px;
        bottom: 12px;
        width: 48px;
        height: 48px;
        border-radius: 10px;
      }

      #avatar {
        width: 24px;
        height: 24px;
        font-size: 10px;
      }

      #content .header {
        font-size: 11px;
      }

      #content .timer {
        font-size: 10px;
      }

      #content .details-line {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div id="watermark">
    <div id="avatar">?</div>
    <div id="content">
      <div class="header">
        <span class="software">Presko Menu</span>
        <span class="player" id="wm-player"></span>
        <span class="timer" id="wm-timer">00:00:00</span>
      </div>
      <div class="details-line" id="wm-details">
        <span class="no-details">No details</span>
      </div>
    </div>
  </div>

  <img id="logo" src="assets/presko-logo.webp" alt="Presko logo">

  <script>
    (function () {
      const avatarEl = document.getElementById('avatar');
      const wmPlayer = document.getElementById('wm-player');
      const wmTimer = document.getElementById('wm-timer');
      const wmDetails = document.getElementById('wm-details');

      let sessionStartTime = Date.now();
      let timerInterval = null;
      let playerName = '';

      function setAvatarImage(url) {
        if (!avatarEl) return;
        if (url && typeof url === 'string' && url.trim() !== '') {
          avatarEl.style.backgroundImage = `url('${url}')`;
          avatarEl.style.background = `url('${url}') center/cover no-repeat`;
          avatarEl.textContent = '';
        } else {
          avatarEl.style.background = 'linear-gradient(135deg, #9eff6e, #6fc9ff)';
          avatarEl.style.backgroundSize = 'cover';
          avatarEl.textContent = getInitials(playerName);
        }
      }

      function getInitials(name) {
        if (!name) return '?';
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
        return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
      }

      function updateAvatar(name) {
        if (!avatarEl.style.backgroundImage || avatarEl.style.backgroundImage === 'none') {
          avatarEl.textContent = getInitials(name);
        }
      }
      function formatTime(seconds) {
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function updateTimers() {
        const now = Date.now();
        const elapsed = (now - sessionStartTime) / 1000;
        const formatted = formatTime(Math.max(0, elapsed));
        if (wmTimer) wmTimer.textContent = formatted;
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        updateTimers();
        timerInterval = setInterval(updateTimers, 1000);
      }

      function setSessionStart(timestampMs) {
        if (timestampMs && typeof timestampMs === 'number' && timestampMs > 0) {
          sessionStartTime = timestampMs;
        } else {
          sessionStartTime = Date.now();
        }
        updateTimers();
      }
      function renderDetails(details) {
        if (!wmDetails) return;

        const fields = [
          { key: 'Membership', label: 'Membership' },
          { key: 'version', label: 'Version' },
        ];

        const parts = [];
        fields.forEach(field => {
          const value = details[field.key];
          if (value !== undefined && value !== null && value !== '') {
            parts.push(`<span class="label">${field.label}</span> <span class="value">${escapeHtml(String(value))}</span>`);
          }
        });

        if (parts.length === 0) {
          wmDetails.innerHTML = '<span class="no-details">No details</span>';
        } else {
          wmDetails.innerHTML = parts.join(' <span class="sep">|</span> ');
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      window.addEventListener("message", function (event) {
        const data = event.data;
        if (!data || typeof data !== 'object') return;

        if (data.action === "userdetails" && data.data) {
          const details = data.data;
          if (details.playerName) {
            playerName = details.playerName;
            if (wmPlayer) wmPlayer.textContent = playerName;
          }
          if (details.avatarUrl) {
            setAvatarImage(details.avatarUrl);
          } else {
            setAvatarImage(null);
          }
          if (details.sessionStart !== undefined && typeof details.sessionStart === 'number') {
            setSessionStart(details.sessionStart);
          } else if (details.sessionElapsed !== undefined && typeof details.sessionElapsed === 'number') {
            const now = Date.now();
            sessionStartTime = now - (details.sessionElapsed * 1000);
            updateTimers();
          }
          renderDetails(details);
          startTimer();
        }
      });
      setAvatarImage(null);
      startTimer();
    })();
  </script>
</body>
</html>
