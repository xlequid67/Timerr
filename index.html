<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0e1218">

    <title>Presko Timer</title>

    <style>
        /*
         * =====================================================
         * GLOBAL DISPLAY-ONLY MODE
         * =====================================================
         */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            /*
             * Prevent this DUI from becoming an input target.
             */
            pointer-events: none !important;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: transparent !important;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            /*
             * Display only.
             */
            pointer-events: none !important;

            /*
             * Prevent text selection.
             */
            user-select: none !important;

            /*
             * Prevent accidental touch/click behavior.
             */
            -webkit-user-select: none !important;
            -webkit-touch-callout: none !important;

            /*
             * The document itself must never become
             * an interaction surface.
             */
            cursor: default !important;
        }

        body {
            position: relative;
        }

        /*
         * =====================================================
         * WATERMARK
         * =====================================================
         */

        #watermark {
            position: fixed;

            top: 16px;
            right: 16px;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 8px 14px 8px 10px;

            min-width: 220px;

            background: rgba(14, 18, 24, 0.94);

            color: #e8edf5;

            border-radius: 8px;

            border: 1px solid
                rgba(255, 255, 255, 0.06);

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.30),
                0 1px 2px rgba(0, 0, 0, 0.10);

            z-index: 10003;

            /*
             * Absolutely no mouse interaction.
             */
            pointer-events: none !important;

            user-select: none !important;
        }

        /*
         * =====================================================
         * AVATAR
         * =====================================================
         */

        #avatar {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #9eff6e,
                    #6fc9ff
                );

            color: #0e1218;

            font-size: 13px;
            font-weight: 700;

            overflow: hidden;

            pointer-events: none !important;
            user-select: none !important;
        }

        /*
         * =====================================================
         * CONTENT
         * =====================================================
         */

        #content {
            display: flex;
            flex-direction: column;

            gap: 2px;

            min-width: 0;
            flex: 1;

            pointer-events: none !important;
        }

        .header {
            display: flex;
            align-items: baseline;

            gap: 6px;

            font-size: 13px;

            pointer-events: none !important;
        }

        .software {
            color: #008CFF;

            font-weight: 600;

            letter-spacing: 0.3px;

            pointer-events: none !important;
        }

        .player {
            color: #e8edf5;

            font-weight: 500;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            max-width: 110px;

            pointer-events: none !important;
        }

        .timer {
            margin-left: auto;

            color: #008CFF;

            font-size: 12px;

            font-weight: 600;

            font-variant-numeric:
                tabular-nums;

            pointer-events: none !important;
        }

        .details-line {
            font-size: 11px;

            color: #b3ffa0;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            pointer-events: none !important;
        }

        .label {
            color: #8a9bb5;

            pointer-events: none !important;
        }

        .value {
            color: #e8edf5;

            pointer-events: none !important;
        }

        .sep {
            color: #4a5a4e;

            margin: 0 4px;

            pointer-events: none !important;
        }

        /*
         * =====================================================
         * LOGO
         * =====================================================
         */

        #logo {
            position: fixed;

            right: 16px;
            bottom: 16px;

            width: 64px;
            height: 64px;

            object-fit: cover;

            border-radius: 12px;

            border: 1px solid
                rgba(255, 255, 255, 0.06);

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.30),
                0 1px 2px rgba(0, 0, 0, 0.10);

            z-index: 10003;

            pointer-events: none !important;

            user-select: none !important;

            -webkit-user-drag: none;
        }

        /*
         * =====================================================
         * MOBILE
         * =====================================================
         */

        @media (max-width: 600px) {

            #watermark {
                top: 12px;
                right: 12px;

                min-width: 160px;

                padding: 6px 10px;

                gap: 6px;

                pointer-events: none !important;
            }

            #avatar {
                width: 24px;
                height: 24px;

                font-size: 10px;
            }

            .header {
                font-size: 11px;
            }

            .timer {
                font-size: 10px;
            }

            .details-line {
                font-size: 10px;
            }

            #logo {
                right: 12px;
                bottom: 12px;

                width: 48px;
                height: 48px;

                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         WATERMARK
         ===================================================== -->

    <div id="watermark">

        <div id="avatar">?</div>

        <div id="content">

            <div class="header">

                <span class="software">
                    Presko Menu
                </span>

                <span
                    class="player"
                    id="wm-player"
                >
                    Unknown
                </span>

                <span
                    class="timer"
                    id="wm-timer"
                >
                    00:00:00
                </span>

            </div>

            <div
                class="details-line"
                id="wm-details"
            >
                <span class="label">
                    Membership
                </span>

                <span class="value">
                    Lifetime
                </span>

                <span class="sep">|</span>

                <span class="label">
                    Version
                </span>

                <span class="value">
                    V4
                </span>
            </div>

        </div>

    </div>

    <!-- =====================================================
         LOGO
         ===================================================== -->

    <img
        id="logo"
        src="https://www.image2url.com/r2/default/images/1790674994406-c608b4ff-ca85-4c85-a7e9-4c2dae03a8e3.png"
        alt=""
        draggable="false"
    >

    <script>
        (() => {

            "use strict";

            /*
             * =================================================
             * ELEMENTS
             * =================================================
             */

            const player =
                document.getElementById("wm-player");

            const timer =
                document.getElementById("wm-timer");

            const avatar =
                document.getElementById("avatar");

            const details =
                document.getElementById("wm-details");


            /*
             * =================================================
             * STATE
             * =================================================
             */

            let playerName = "Unknown";

            let sessionStart = Date.now();


            /*
             * =================================================
             * INITIALS
             * =================================================
             */

            function initials(name) {

                if (!name) {
                    return "?";
                }

                const parts =
                    String(name)
                        .trim()
                        .split(/\s+/);

                if (!parts.length) {
                    return "?";
                }

                if (parts.length === 1) {

                    return parts[0]
                        .charAt(0)
                        .toUpperCase();
                }

                return (
                    parts[0].charAt(0) +
                    parts[parts.length - 1]
                        .charAt(0)
                ).toUpperCase();
            }


            /*
             * =================================================
             * PLAYER
             * =================================================
             */

            function setPlayer(name) {

                playerName =
                    String(name || "Unknown");

                player.textContent =
                    playerName;

                avatar.textContent =
                    initials(playerName);
            }


            /*
             * =================================================
             * TIMER FORMAT
             * =================================================
             */

            function formatTime(seconds) {

                const h =
                    Math.floor(seconds / 3600);

                const m =
                    Math.floor(
                        (seconds % 3600) / 60
                    );

                const s =
                    Math.floor(seconds % 60);

                return (
                    String(h).padStart(2, "0") +
                    ":" +
                    String(m).padStart(2, "0") +
                    ":" +
                    String(s).padStart(2, "0")
                );
            }


            /*
             * =================================================
             * TIMER UPDATE
             * =================================================
             */

            function updateTimer() {

                const elapsed =
                    Math.max(
                        0,
                        (Date.now() -
                            sessionStart) / 1000
                    );

                timer.textContent =
                    formatTime(elapsed);
            }


            /*
             * =================================================
             * DETAILS
             *
             * Uses textContent rather than innerHTML so
             * Lua-provided values cannot inject HTML.
             * =================================================
             */

            function setDetails(
                membership,
                version
            ) {

                details.textContent = "";

                const membershipLabel =
                    document.createElement("span");

                membershipLabel.className =
                    "label";

                membershipLabel.textContent =
                    "Membership";

                const membershipValue =
                    document.createElement("span");

                membershipValue.className =
                    "value";

                membershipValue.textContent =
                    String(
                        membership || "Lifetime"
                    );

                const separator =
                    document.createElement("span");

                separator.className =
                    "sep";

                separator.textContent =
                    "|";

                const versionLabel =
                    document.createElement("span");

                versionLabel.className =
                    "label";

                versionLabel.textContent =
                    "Version";

                const versionValue =
                    document.createElement("span");

                versionValue.className =
                    "value";

                versionValue.textContent =
                    String(version || "V4");

                details.appendChild(
                    membershipLabel
                );

                details.appendChild(
                    membershipValue
                );

                details.appendChild(
                    separator
                );

                details.appendChild(
                    versionLabel
                );

                details.appendChild(
                    versionValue
                );
            }


            /*
             * =================================================
             * LUA -> DUI MESSAGE
             * =================================================
             */

            window.addEventListener(
                "message",
                (event) => {

                    const message =
                        event.data;

                    if (!message) {
                        return;
                    }

                    if (
                        message.action !==
                        "userdetails"
                    ) {
                        return;
                    }

                    const data =
                        message.data;

                    if (!data) {
                        return;
                    }


                    /*
                     * Player
                     */

                    setPlayer(
                        data.playerName ||
                        "Unknown"
                    );


                    /*
                     * Membership / Version
                     */

                    setDetails(
                        data.Membership ||
                            "Lifetime",

                        data.version ||
                            "V4"
                    );


                    /*
                     * Session timer
                     */

                    if (
                        typeof data.sessionStart ===
                        "number"
                    ) {

                        sessionStart =
                            data.sessionStart;
                    }


                    /*
                     * Avatar
                     */

                    if (data.avatarUrl) {

                        /*
                         * Use CSS background image.
                         * The element still cannot receive
                         * pointer input.
                         */

                        avatar.style.background =
                            `url("${String(data.avatarUrl)}")
                             center / cover no-repeat`;

                        avatar.textContent = "";

                    } else {

                        avatar.style.background =
                            "linear-gradient(" +
                            "135deg," +
                            "#9eff6e," +
                            "#6fc9ff" +
                            ")";

                        avatar.textContent =
                            initials(playerName);
                    }

                    updateTimer();
                }
            );


            /*
             * =================================================
             * DEFAULT STATE
             * =================================================
             */

            setPlayer("Unknown");

            setDetails(
                "Lifetime",
                "V4"
            );

            updateTimer();


            /*
             * =================================================
             * TIMER
             * =================================================
             */

            setInterval(
                updateTimer,
                1000
            );

        })();
    </script>

</body>
</html>
